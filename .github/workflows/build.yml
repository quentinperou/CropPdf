name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build, test and package
    # windows-latest ships Visual Studio Build Tools (MSVC, CMake, Ninja) and the Windows SDK (makeappx).
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Install Inno Setup
        shell: powershell
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Check that the tag matches the version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: powershell
        run: |
          $version = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match version $version in Directory.Build.props."
          }

      - name: Build
        shell: powershell
        run: .\scripts\build.ps1

      # Only a release needs the installer, to hand it to the job below; other builds just check that it builds.
      - uses: actions/upload-artifact@v7
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: CropPdf-Setup
          path: dist/CropPdf-Setup-*.exe
          if-no-files-found: error
          retention-days: 1

  release:
    name: Publish the release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: CropPdf-Setup

      # A tag with a suffix (v1.2.0-beta.1) is published as a pre-release: only the app's Beta channel offers it.
      - uses: softprops/action-gh-release@v3
        with:
          files: CropPdf-Setup-*.exe
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}